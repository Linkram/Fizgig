[project]
name = "comfyui-fizgig-refmod"
version = "0.1.0"
description = "Loads a Fizgig-made MiniMax H3 RefMod in one node: the reference mod into the conditioning and, when the file carries one, its rank-2 companion LoRA onto the model. Standard RefMod files load too."
license = { text = "MIT" }
authors = [
    { name = "Peter Neill" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/shootthesound/Fizgig"
Repository = "https://github.com/shootthesound/Fizgig"

[tool.comfy]
PublisherId = "shootthesound"
DisplayName = "Fizgig H3 RefMod"
Icon = "https://avatars.githubusercontent.com/u/110498357?v=4"
